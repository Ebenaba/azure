name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: packages/backend
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/cleango-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/cleango-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin-dashboard image
        uses: docker/build-push-action@v5
        with:
          context: packages/admin-dashboard
          file: packages/admin-dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/cleango-admin:${{ github.sha }}
            ghcr.io/${{ github.repository }}/cleango-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/cleango
            docker compose pull
            docker compose up -d --no-build
            docker image prune -f
