version: '3.9'

networks:
  cleango-network:
    driver: bridge

volumes:
  redis-data:
  certbot-certs:
  certbot-www:

services:
  backend:
    build:
      context: packages/backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - packages/backend/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cleango-network
    restart: unless-stopped

  admin-dashboard:
    build:
      context: packages/admin-dashboard
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - packages/admin-dashboard/.env.local
    depends_on:
      - backend
    networks:
      - cleango-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - cleango-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
      - admin-dashboard
    networks:
      - cleango-network
    restart: unless-stopped
