version: '3.9'

# Development overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    build:
      context: packages/backend
      dockerfile: Dockerfile
      target: build
    volumes:
      - ./packages/backend/src:/app/src:cached
    command: node --watch src/server.js
    environment:
      NODE_ENV: development

  admin-dashboard:
    build:
      context: packages/admin-dashboard
      dockerfile: Dockerfile
      target: deps
    volumes:
      - ./packages/admin-dashboard:/app:cached
      - /app/node_modules
      - /app/.next
    command: npm run dev
    environment:
      NODE_ENV: development

  nginx:
    profiles:
      - production
